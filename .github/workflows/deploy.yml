name: Deploy React to S3

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build React app
        run: pnpm run build

      - name: Debug OIDC
        run: |
          echo "Repo: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"

      # AWS Credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::068514513330:role/foris-code-challenge
          aws-region: us-east-1

      - run: aws s3 sync ./build/client s3://rick-morty-game --delete

      # TODO: Use this when cloudfront is available
      # - run: |
      #     aws cloudfront create-invalidation \
      #       --distribution-id E5S7U06YXPCS9 \
      #       --paths "/*"
